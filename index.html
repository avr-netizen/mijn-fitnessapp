<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mijn Fitnessapp 1.6</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#10151e;color:#f1f5fa}body{margin:0;max-width:650px;margin-inline:auto;padding:18px 14px 80px}h1{font-size:25px;margin:6px 0 18px}h2{font-size:18px}button,input,select,textarea{font:inherit}button{background:#2776ee;border:0;border-radius:11px;color:white;padding:12px 14px;cursor:pointer}button.secondary{background:#273245}button.danger{background:#7c2e37}button:disabled{opacity:.5}.manageitem{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #3b4655;padding:11px 0}.manageitem:last-child{border-bottom:0}.manageitem .actions{flex-shrink:0}.notice{border-left:3px solid #7faeff;padding:9px 12px;background:#202a39;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.tile{background:#202a39;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:67px;justify-content:center}.tile .elapsed{font-size:12px;color:#d5e4ff;font-weight:500}.tile .groupname{font-size:16px;font-weight:650}.panel{background:#1b2533;padding:14px;border-radius:14px;margin:12px 0}.muted{color:#b4c0cf;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}.row>*{min-width:0}input,select,textarea{box-sizing:border-box;width:100%;background:#111a26;border:1px solid #526176;border-radius:9px;color:white;padding:10px}label{display:block;margin:10px 0 5px}.setrow{display:grid;grid-template-columns:1fr 1fr 1fr 38px;gap:7px;align-items:center;margin:8px 0}.setrow input{padding:8px 4px;min-width:0}.unitfield{display:flex;align-items:center;background:#111a26;border:1px solid #526176;border-radius:9px;min-width:0;overflow:hidden}.unitfield input{border:0;background:transparent;width:100%;min-width:0;padding:8px 4px 8px 8px}.unitfield span{font-size:12px;color:#b4c0cf;padding-right:7px;white-space:nowrap}.setrow{grid-template-columns:minmax(60px,1fr) minmax(0,1fr) minmax(0,1fr)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}nav button{flex:1}.small{padding:8px 10px}#message{color:#9de4b4;min-height:18px}hr{border:0;border-top:1px solid #3b4655;margin:18px 0}</style></head><body><h1>💪 Mijn Fitnessapp</h1><nav><button class="secondary" onclick="show('home')">Training</button><button class="secondary" onclick="show('history')">Geschiedenis</button><button class="secondary" onclick="show('backup')">Back-up</button></nav><div id="app"></div><p id="message" role="status"></p><script>
const KEY='mijnfitness_v1';const groups=['Borst','Rug','Schouders','Biceps','Triceps','Benen','Buik','Cardio'];const initial={exercises:[['Chest press','Borst','apparaat'],['Incline chest press','Borst','apparaat'],['Pec deck','Borst','apparaat'],['Lat pulldown','Rug','apparaat'],['Seated row','Rug','apparaat'],['Shoulder press','Schouders','apparaat'],['Lateral raise','Schouders','dumbbell'],['Biceps curl','Biceps','dumbbell'],['Triceps pushdown','Triceps','apparaat'],['Leg press','Benen','apparaat'],['Leg curl','Benen','apparaat'],['Abdominal crunch','Buik','apparaat'],['Loopband','Cardio','cardio'],['Hometrainer','Cardio','cardio'],['Crosstrainer','Cardio','cardio']].map((x,i)=>({id:'base'+i,name:x[0],group:x[1],type:x[2]})),sessions:[],draft:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{db=structuredClone(initial)};let group='Borst',current=null,workoutEntry=null;const app=document.getElementById('app');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function msg(t){document.getElementById('message').textContent=t;setTimeout(()=>document.getElementById('message').textContent='',4000)}function latest(id){for(let i=db.sessions.length-1;i>=0;i--){let r=db.sessions[i].items.find(x=>x.exerciseId===id);if(r)return r}return null}function show(p){if(p==='home')home();if(p==='history')history();if(p==='backup')backup()}function dayNumber(date){const d=new Date(date);if(!Number.isFinite(d.getTime()))return null;return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}function groupAge(g){let last=null;for(const session of db.sessions){if(!Array.isArray(session.items)||!session.items.some(item=>item.group===g))continue;const day=dayNumber(session.date);if(day!==null&&(last===null||day>last))last=day}if(last===null)return 'Nog niet getraind';const days=Math.max(0,dayNumber(new Date())-last);return days===0?'Vandaag · 0 dagen':days===1?'1 dag geleden':days+' dagen geleden'}function home(){app.innerHTML='<h2>Spiergroepen</h2><p class="muted">Tik op een spiergroep om de oefeningen te bekijken.</p><div class="grid">'+groups.map(g=>`<button class="tile" data-group="${esc(g)}"><span class="groupname">${esc(g)} ${group===g?'✓':''}</span><span class="elapsed">${esc(groupAge(g))}</span></button>`).join('')+'</div><h2>'+esc(group)+'</h2>'+db.exercises.filter(e=>e.group===group&&!e.archived).map(e=>`<div class="row panel"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.type)}</div></div><button onclick="edit('${e.id}')">Open</button></div>`).join('')+'<p><button class="secondary" onclick="manageExercises()">⚙ Oefeningen beheren</button></p><div class="panel"><h2>Oefening toevoegen</h2><label>Naam</label><input id="newname" placeholder="Naam oefening"><label>Type</label><select id="newtype"><option value="apparaat">Apparaat</option><option value="dumbbell">Dumbbells / losse gewichten</option><option value="cardio">Cardio</option></select><p><button onclick="addExercise()">Toevoegen</button></p></div><div class="panel"><b>Huidige training</b><p>'+db.draft.length+' oefeningen geregistreerd</p>'+db.draft.map(x=>'<div>'+esc(x.name)+'</div>').join('')+'<p><button onclick="finish()" '+(!db.draft.length?'disabled':'')+'>Klaar met training</button></p></div>'}app.addEventListener('click',function(event){const button=event.target.closest('button[data-group]');if(!button)return;group=button.dataset.group;home()});function manageExercises(){const active=db.exercises.filter(e=>e.group===group&&!e.archived),archived=db.exercises.filter(e=>e.group===group&&e.archived);app.innerHTML=`<button class="secondary small" onclick="home()">← Terug naar ${esc(group)}</button><h2>Oefeningen beheren · ${esc(group)}</h2><p class="muted">Archiveren verwijdert een oefening uit de trainingslijst, maar bewaart alle afgeronde trainingen en instellingen.</p><div class="panel"><h2>Actieve oefeningen (${active.length})</h2>${active.length?active.map(e=>`<div class="manageitem"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.type)}</div></div><div class="actions"><button class="secondary small" data-archive="${esc(e.id)}">Archiveren</button></div></div>`).join(''):'<p class="muted">Geen actieve oefeningen.</p>'}</div><div class="panel"><h2>Gearchiveerd (${archived.length})</h2>${archived.length?archived.map(e=>`<div class="manageitem"><div><b>${esc(e.name)}</b><div class="muted">Geschiedenis blijft bewaard</div></div><div class="actions"><button class="secondary small" data-restore="${esc(e.id)}">Terugzetten</button></div></div>`).join(''):'<p class="muted">Nog geen gearchiveerde oefeningen.</p>'}</div>`}function archiveExercise(id){const e=db.exercises.find(x=>x.id===id);if(!e)return;if(db.draft.some(x=>x.exerciseId===id)){msg('Deze oefening staat nog in je huidige training. Rond die eerst af.');return}if(!confirm('"'+e.name+'" archiveren? Je trainingsgeschiedenis blijft bewaard.'))return;e.archived=true;save();manageExercises();msg('Oefening gearchiveerd')}function unarchiveExercise(id){const e=db.exercises.find(x=>x.id===id);if(!e)return;e.archived=false;save();manageExercises();msg('Oefening teruggezet')}app.addEventListener('click',function(event){const a=event.target.closest('button[data-archive]');if(a){archiveExercise(a.dataset.archive);return}const r=event.target.closest('button[data-restore]');if(r){unarchiveExercise(r.dataset.restore)}});
function addExercise(){let name=document.getElementById('newname').value.trim(),type=document.getElementById('newtype').value;if(!name)return msg('Vul een naam in');db.exercises.push({id:'e'+Date.now(),name,group,type});save();home()}function edit(id){current=db.exercises.find(x=>x.id===id&&!x.archived);if(!current)return home();let prev=latest(id),draft=db.draft.find(x=>x.exerciseId===id);workoutEntry=draft?structuredClone(draft):{exerciseId:id,name:current.name,type:current.type,group:current.group,settings:prev?.settings||'',notes:prev?.notes||'',sets:prev?.sets?.map(s=>({...s}))||[{kg:'',reps:''},{kg:'',reps:''},{kg:'',reps:''}],warmup:prev?.warmup?{...prev.warmup}:null,cardio:prev?.cardio?{...prev.cardio}:{minutes:'',distance:'',pulse:'',maxPulse:'',resistance:''}};renderEdit()}function renderEdit(){let prev=latest(current.id);app.innerHTML=`<button class="secondary small" onclick="home()">← Terug</button><h2>${esc(current.name)}</h2><p class="muted">${prev?'Vorige training: '+new Date(prev.savedAt).toLocaleDateString('nl-BE'):'Nog geen vorige training'}</p>${prev&&prev.type!=='cardio'?'<div class="panel">'+prev.sets.map((s,i)=>`Set ${i+1}: ${esc(s.kg)} kg × ${esc(s.reps)}<br>`).join('')+'Instellingen: '+esc(prev.settings||'—')+'</div>':''}<div id="fields"></div><p><button onclick="storeExercise()">Oefening opslaan</button></p>`;renderFields()}function renderFields(){let root=document.getElementById('fields');if(workoutEntry.type==='cardio'){root.innerHTML=`<label>Duur</label><div class="unitfield"><input type="number" min="0" step="any" value="${esc(workoutEntry.cardio.minutes)}" oninput="workoutEntry.cardio.minutes=this.value"><span>min</span></div><label>Afstand</label><div class="unitfield"><input type="number" min="0" step="any" value="${esc(workoutEntry.cardio.distance)}" oninput="workoutEntry.cardio.distance=this.value"><span>km</span></div><label>Gemiddelde hartslag (optioneel)</label><div class="unitfield"><input type="number" min="0" value="${esc(workoutEntry.cardio.pulse)}" oninput="workoutEntry.cardio.pulse=this.value"><span>bpm</span></div><label>Maximale hartslag (optioneel)</label><div class="unitfield"><input aria-label="Maximale hartslag in bpm" type="number" min="0" step="1" value="${esc(workoutEntry.cardio.maxPulse??'')}" oninput="workoutEntry.cardio.maxPulse=this.value"><span>bpm</span></div><label>Weerstand / helling / snelheid</label><input value="${esc(workoutEntry.cardio.resistance)}" oninput="workoutEntry.cardio.resistance=this.value">`;return}root.innerHTML=`<p><label><input type="checkbox" style="width:auto" ${workoutEntry.warmup?'checked':''} onchange="workoutEntry.warmup=this.checked?{kg:'',reps:'',minutes:''}:null;renderFields()"> Opwarmset</label></p>${workoutEntry.warmup?setRow(workoutEntry.warmup,'Opwarm',-1)+`<label>Opwarmduur (optioneel)</label><div class="unitfield"><input aria-label="Opwarmduur in minuten" type="number" min="0" step="any" value="${esc(workoutEntry.warmup.minutes||'')}" oninput="workoutEntry.warmup.minutes=this.value"><span>min</span></div>`:''}<div class="muted">Per rij: gewicht in kg en aantal herhalingen. Opwarming staat boven de werksets.</div>${workoutEntry.sets.map((s,i)=>setRow(s,'Set '+(i+1),i)).join('')}<p><button class="secondary small" onclick="workoutEntry.sets.push({kg:'',reps:''});renderFields()">+ Set toevoegen</button> <button class="secondary small" ${workoutEntry.sets.length<=1?'disabled':''} onclick="workoutEntry.sets.pop();renderFields()">− Laatste set</button></p><label>${workoutEntry.type==='dumbbell'?'Instellingen (gewicht per dumbbell)':'Stoelstand en toestelinstellingen'}</label><input value="${esc(workoutEntry.settings)}" oninput="workoutEntry.settings=this.value"><label>Opmerkingen</label><textarea oninput="workoutEntry.notes=this.value">${esc(workoutEntry.notes)}</textarea>`}function setRow(s,label,i){let target=i===-1?'workoutEntry.warmup':`workoutEntry.sets[${i}]`;return `<div class="setrow"><b>${label}</b><div class="unitfield"><input aria-label="Gewicht ${label} in kg" type="number" min="0" step="any" value="${esc(s.kg)}" oninput="${target}.kg=this.value"><span>kg</span></div><div class="unitfield"><input aria-label="Herhalingen ${label}" type="number" min="0" step="1" value="${esc(s.reps)}" oninput="${target}.reps=this.value"><span>reps</span></div></div>`}function storeExercise(){if(workoutEntry.type!=='cardio'&&!workoutEntry.sets.some(s=>String(s.kg).trim()!==''&&String(s.reps).trim()!==''))return msg('Vul minstens één set in');workoutEntry.savedAt=new Date().toISOString();db.draft=db.draft.filter(x=>x.exerciseId!==current.id);db.draft.push(structuredClone(workoutEntry));save();msg('Oefening opgeslagen');home()}function finish(){if(!db.draft.length)return;db.sessions.push({id:'s'+Date.now(),date:new Date().toISOString(),items:structuredClone(db.draft)});db.draft=[];save();app.innerHTML='<div class="panel"><h2>✓ Training afgerond</h2><p>Je training is lokaal bewaard.</p><p>Wil je nu een volledige back-up via Gmail naar jezelf versturen?</p><button onclick="shareBackup()">Back-up maken en delen</button> <button class="secondary" onclick="home()">Later</button></div>'}function history(){app.innerHTML='<h2>Trainingsgeschiedenis</h2>'+(db.sessions.length?db.sessions.slice().reverse().map(s=>`<div class="panel"><b>${new Date(s.date).toLocaleString('nl-BE')}</b>${s.items.map(x=>`<p>${esc(x.name)} — ${x.type==='cardio'?esc(x.cardio.minutes)+' min'+(x.cardio.pulse!==undefined&&String(x.cardio.pulse)!==''?' · gem. '+esc(x.cardio.pulse)+' bpm':'')+(x.cardio.maxPulse!==undefined&&String(x.cardio.maxPulse)!==''?' · max. '+esc(x.cardio.maxPulse)+' bpm':''):x.sets.map(y=>esc(y.kg)+'kg × '+esc(y.reps)).join(', ')}</p>`).join('')}</div>`).join(''):'Nog geen afgeronde trainingen.')}function backup(){app.innerHTML='<h2>Back-up en herstel</h2><p>Maak een JSON-bestand van al je oefeningen, trainingsgeschiedenis en instellingen. Deel dit bestand via Gmail of bewaar het in Bestanden.</p><button onclick="shareBackup()">Back-up maken en delen</button><hr><h2>Back-up terugzetten</h2><p class="muted">Let op: terugzetten vervangt alle gegevens op dit apparaat.</p><input type="file" id="restore" accept="application/json,.json"><p><button class="secondary" onclick="restoreBackup()">Back-up importeren</button></p><p class="muted">Bewaar je back-up zorgvuldig: hij bevat je trainingsgegevens. Deze versie heeft geen accountlogin of synchronisatie.</p>'}async function shareBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),file=new File([blob],'fitness-backup-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Fitness back-up'});return}catch(e){if(e.name==='AbortError')return}}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);msg('Back-up gedownload. Voeg het bestand toe aan een e-mail in Gmail.')}async function restoreBackup(){let f=document.getElementById('restore').files[0];if(!f)return msg('Kies eerst een bestand');try{let d=JSON.parse(await f.text());if(!Array.isArray(d.exercises)||!Array.isArray(d.sessions)||!Array.isArray(d.draft))throw Error('Ongeldig formaat');if(!confirm('Alle huidige gegevens vervangen door deze back-up?'))return;db=d;save();msg('Back-up hersteld');home()}catch(e){msg('Dit is geen geldige back-up')}}home();</script></body></html>
